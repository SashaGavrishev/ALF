# Fork-only CI, beside upstream's tests.yml rather than replacing it.
#
# Runs what this fork builds -- GNU, HDF5, serial and MPI -- on a stock runner
# with no container. ALF builds its own HDF5 either way, so dropping the
# container costs only the apt line below. The image is pinned rather than
# `latest`: the Devel legs compile with -Werror, so a runner bumping gfortran
# turns CI red with no commit behind it.
name: "Fork tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # ALF generates its own module dependencies, so the build parallelises.
  # make reads this from the environment, which keeps it out of the shared
  # alf_test action.
  MAKEFLAGS: "-j4"

jobs:
  lint_stopcommands:
    name: Lint Fortran STOP statements
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check for forbidden STOP/ERROR STOP
        run: |
          set -euo pipefail
          ! grep -irn -e "^\s*error\s*stop" -e "^\s*stop" --include="*.F90" \
            --exclude-dir=Analysis --exclude-dir=HDF5 --exclude-dir=testsuite \
            --exclude-dir=Not_supported --exclude="runtime_error_mod.F90" || {
            echo "STOP/ERROR STOP found."; exit 1;
          }

  build_and_test:
    name: GNU · ${{ matrix.mode }} · ${{ matrix.devel || 'plain' }} · HDF5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # MPI is the only configuration that compiles control_mod's MPI_REDUCE
        # of the timers and acceptances. Devel adds -pedantic -Werror and
        # -O0 -fcheck=all.
        mode: [noMPI, MPI]
        devel: ["", "Devel"]
    steps:
      - uses: actions/checkout@v6

      # gfortran and cmake are preinstalled; the reference BLAS is not.
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libblas-dev liblapack-dev

      # Installs one MPI and puts its wrapper and launcher on PATH together.
      # apt-installing a second MPI beside the image's own leaves mpifort and
      # mpiexec free to resolve to different ones, and the mismatch is silent:
      # every rank initialises as a singleton rank 0.
      - name: Set up MPI
        if: matrix.mode == 'MPI'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi

      - name: Record compiler version
        id: fc
        run: echo "version=$(gfortran -dumpfullversion)" >> "$GITHUB_OUTPUT"

      # Keyed on the full compiler version: the Fortran module HDF5 installs is
      # only readable by the compiler that built it, and the module format can
      # change within a major release. The MPI legs build it with mpifort,
      # hence the mode in the key.
      - name: Cache the HDF5 build
        uses: actions/cache@v5
        with:
          key: linux-HDF5-gfortran-${{ steps.fc.outputs.version }}-${{ matrix.mode }}
          path: HDF5/*/

      - uses: ./.github/actions/alf_test
        with:
          args: GNU ${{ matrix.mode }} ${{ matrix.devel }} HDF5
